<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("fh_theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<title>传输助手</title>
<link rel="icon" href="data:,">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{
  color-scheme:light;
  --bg:#eaeef3;
  --surface:#fff;
  --surface-2:#f4f6f9;
  --stream:#e2e7ed;
  --line:#e6eaee;
  --bubble-line:rgba(16,24,40,.08);
  --line-2:#d9dee4;
  --text:#17191c;
  --text-2:#545b62;
  --sub:#8b929a;
  --placeholder:#b4bac1;
  --brand:#07c160;
  --brand-dark:#06ad56;
  --brand-soft:rgba(7,193,96,.12);
  --own:#95ec69;
  --own-text:#17191c;
  --hover:#f1f4f7;
  --shadow-1:0 1px 3px rgba(16,24,40,.09);
  --shadow-2:0 8px 28px rgba(16,24,40,.12);
  --danger:#e64340;
  --danger-soft:#fdf3f2;
  --danger-line:#f0c9c7;
  --warn-bg:#fff8e6;
  --warn-text:#8a6a2b;
  --warn-line:#f2e6c8;
  --tag-bg:#eff2f5;
  --tag-text:#7c848c;
  --tag-hover:#e6ebf0;
  --bar-bg:#eef1f4;
  --bar-fill:#c3cad2;
  --send-disabled:#c9ced4;
  --overlay:rgba(16,24,40,.32);
  --toast-bg:rgba(23,25,28,.86);
  --seg-bg:#f1f4f7;
  --seg-on:#fff;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080a0d;
  --surface:#1b2027;
  --surface-2:#232931;
  --stream:#0b0e12;
  --line:#262a31;
  --bubble-line:#2f3843;
  --line-2:#333941;
  --text:#e6e9ec;
  --text-2:#a6adb6;
  --sub:#79818b;
  --placeholder:#5d656e;
  --brand:#07c160;
  --brand-dark:#0dd470;
  --brand-soft:rgba(7,193,96,.18);
  --own:#2c5f43;
  --own-text:#eaf5ee;
  --hover:#23272e;
  --shadow-1:0 1px 3px rgba(0,0,0,.55);
  --shadow-2:0 10px 32px rgba(0,0,0,.5);
  --danger:#ff6b66;
  --danger-soft:rgba(255,107,102,.1);
  --danger-line:rgba(255,107,102,.35);
  --warn-bg:#2a2418;
  --warn-text:#e0c17a;
  --warn-line:#3a3222;
  --tag-bg:#242930;
  --tag-text:#8b939d;
  --tag-hover:#2c323a;
  --bar-bg:#242830;
  --bar-fill:#4a525c;
  --send-disabled:#3a4048;
  --overlay:rgba(0,0,0,.55);
  --toast-bg:rgba(48,52,58,.94);
  --seg-bg:#23272e;
  --seg-on:#31373f;
}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s,color .2s}
.app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:820px;margin:0 auto;background:var(--bg);position:relative}
@media (min-width:821px){.app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(16,24,40,.06)}}

.topbar{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;z-index:5;transition:background .2s,border-color .2s}
.brand{font-size:16px;font-weight:500;letter-spacing:.02em}
.tools{display:flex;gap:1px}
.tbtn{background:none;border:0;padding:7px 8px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit;border-radius:var(--r-sm);transition:background .15s,color .15s}
.tbtn:hover{background:var(--hover);color:var(--text)}
.tbtn:active{transform:scale(.97)}
.tbtn.icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tbtn.icon svg{display:block}

.banner{display:none;flex:none;padding:9px 18px;background:var(--warn-bg);color:var(--warn-text);font-size:12px;line-height:1.5;border-bottom:1px solid var(--warn-line)}
.banner.on{display:block;animation:slideDown .2s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.stream{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 18px;background:var(--stream);-webkit-overflow-scrolling:touch;transition:background .2s}
.stream{scrollbar-width:thin;scrollbar-color:var(--bar-fill) transparent}
.stream::-webkit-scrollbar{width:10px;height:10px}
.stream::-webkit-scrollbar-track{background:transparent}
.stream::-webkit-scrollbar-thumb{background:var(--bar-fill);border-radius:99px;border:3px solid transparent;background-clip:padding-box;transition:background .2s}
.stream::-webkit-scrollbar-thumb:hover{background:var(--sub);background-clip:padding-box}
.stream::-webkit-scrollbar-thumb:active{background:var(--text-2);background-clip:padding-box}

.msg{display:block;margin:18px 0}
.msg.anim{animation:msgIn .24s cubic-bezier(.22,.9,.3,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.col{width:100%;display:flex;flex-direction:column;align-items:flex-start}
.meta{font-size:12px;color:var(--sub);margin-bottom:6px}
.body{display:inline-flex;flex-direction:column;max-width:100%;min-width:0}
.bubble{max-width:100%;background:var(--surface);color:var(--text);border:1px solid var(--bubble-line);border-radius:var(--r-md);padding:10px 13px;font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap;box-shadow:var(--shadow-1);transition:background .2s,color .2s,border-color .2s}
.foot{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:4px;min-height:26px}
.time{font-size:11px;color:var(--sub);flex:none;white-space:nowrap}
.msg.own .bubble{background:var(--own);color:var(--own-text);box-shadow:none;border-color:transparent}
.bubble.img{padding:0;background:transparent;line-height:0;box-shadow:none;border-color:transparent}
.bubble.img img{display:block;max-width:100%;max-height:320px;border-radius:var(--r-md);cursor:zoom-in;object-fit:cover;box-shadow:var(--shadow-1);transition:transform .22s ease,box-shadow .22s}
.bubble.img img:hover{transform:scale(1.012);box-shadow:var(--shadow-2)}

.card{display:flex;align-items:center;gap:11px;min-width:190px;cursor:pointer;padding:2px 0}
.tag{flex:none;width:38px;height:38px;border-radius:10px;background:var(--tag-bg);color:var(--tag-text);font-size:9px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;text-transform:uppercase;transition:background .15s}
.msg.own .tag{background:rgba(255,255,255,.18)}
.card:hover .tag{background:var(--tag-hover)}
.cbody{min-width:0}
.cname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.csize{font-size:11px;color:var(--sub);margin-top:2px}

.prog{margin-top:8px;height:3px;background:var(--bar-bg);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--brand);border-radius:2px;transition:width .2s ease-out}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.prow .pinfo{margin-top:0}
.pinfo{font-size:11px;color:var(--sub);margin-top:6px}
.pcancel{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:0;background:none;color:var(--sub);padding:0;cursor:pointer;font-family:inherit;border-radius:5px;transition:color .15s,background .15s}
.pcancel:hover{color:var(--danger);background:var(--danger-soft)}

.ops{display:flex;gap:2px;opacity:.62;transition:opacity .18s}
.msg:hover .ops{opacity:1}
.msg.pick .ops{display:none}
.msg.pick .bubble, .msg.pick .bubble.img img, .msg.pick .card{cursor:pointer}
.act{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;background:none;color:var(--sub);padding:0;cursor:pointer;font-family:inherit;border-radius:7px;transition:color .15s,background .15s,transform .12s}
.act:hover{color:var(--brand);background:var(--hover)}
.act:active{transform:scale(.92)}
.act:active{opacity:.6}

.msg.pick{cursor:pointer;transition:opacity .15s}
.msg.picked .bubble{outline:2px solid var(--brand);outline-offset:2px}

.selbar{display:none;flex:none;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(16,24,40,.05)}
.selbar.on{display:flex;animation:barIn .18s ease-out}
@keyframes barIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
.sbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:var(--r-sm);padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.sbtn:hover{background:var(--hover)}
.sbtn.danger{color:var(--danger);border-color:var(--danger-line)}
.sbtn.danger:hover{background:var(--danger-soft)}

.composer{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(16,24,40,.04);transition:background .2s,border-color .2s}
.field{border:1.5px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);padding:9px 10px 7px;transition:border-color .18s,box-shadow .18s,background .2s}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea,.panel,.sec textarea{scrollbar-width:thin;scrollbar-color:var(--bar-fill) transparent}
.field textarea::-webkit-scrollbar,.panel::-webkit-scrollbar,.sec textarea::-webkit-scrollbar{width:8px;height:8px}
.field textarea::-webkit-scrollbar-track,.panel::-webkit-scrollbar-track,.sec textarea::-webkit-scrollbar-track{background:transparent}
.field textarea::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb,.sec textarea::-webkit-scrollbar-thumb{background:var(--bar-fill);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.field textarea::-webkit-scrollbar-thumb:hover,.panel::-webkit-scrollbar-thumb:hover,.sec textarea::-webkit-scrollbar-thumb:hover{background:var(--sub);background-clip:padding-box}
.field textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font:inherit;font-size:14px;line-height:20px;max-height:200px;overflow-y:auto;padding:2px 3px;color:var(--text);display:block}
.field textarea::placeholder{color:var(--placeholder)}
.field textarea:disabled{opacity:.5}
.field-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.icon-btn{width:30px;height:30px;border-radius:9px;border:0;background:var(--hover);color:var(--text-2);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding-bottom:2px;transition:background .15s,transform .12s}
.icon-btn:hover{background:var(--tag-hover)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.45;cursor:default}
.send{border:0;background:var(--brand);color:#fff;border-radius:9px;width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .12s,opacity .15s}
.send:hover{background:var(--brand-dark)}
.send:active{transform:scale(.97)}
.send:disabled{background:var(--send-disabled);cursor:default;transform:none;opacity:.75}

.drawer{position:fixed;inset:0;background:var(--overlay);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;z-index:20}
.drawer.on{opacity:1;visibility:visible}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow-2)}
.drawer.on .panel{transform:none}
.phead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.phead span{font-size:15px}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0;padding-bottom:32px}
.sec h3{margin:0 0 12px;font-size:12px;font-weight:400;color:var(--sub);letter-spacing:.04em}
.lbl{display:block;font-size:12px;color:var(--text-2);margin:12px 0 6px}
.sec input,.sec textarea{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;color:var(--text);background:var(--surface-2);outline:none;transition:border-color .18s,box-shadow .18s}
.sec input:focus,.sec textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sec textarea{resize:vertical;line-height:1.65}
.hint{font-size:12px;color:var(--sub);margin:7px 0 0;line-height:1.65}
.hint code{font-size:12px;color:var(--brand-dark)}
.stat-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--text-2);gap:12px}
.stat-row b{font-weight:400;color:var(--text);text-align:right}
.krow{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text-2);padding:4px 0}
.krow span{width:36px;flex:none}
.kbar{flex:1;height:5px;background:var(--bar-bg);border-radius:3px;overflow:hidden}
.kbar i{display:block;height:100%;background:var(--bar-fill);border-radius:3px;transition:width .4s ease-out}
.krow em{font-style:normal;color:var(--sub);width:62px;text-align:right;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;margin-top:14px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;cursor:pointer;transition:background .15s,transform .12s}
.btn:hover{background:var(--brand-dark)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--surface);border:1px solid var(--danger-line);color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}

.seg{display:flex;background:var(--seg-bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--text-2);border-radius:8px;padding:8px 0;font-size:13px;font-family:inherit;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:var(--shadow-1)}

.lightbox{position:fixed;inset:0;background:rgba(8,10,14,.95);display:flex;align-items:center;justify-content:center;z-index:30;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;cursor:zoom-out}
.lightbox.on{opacity:1;visibility:visible}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.96);transition:transform .26s cubic-bezier(.22,.9,.3,1)}
.lightbox.on img{transform:none}

.modal{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.modal.on{opacity:1;visibility:visible}
.mbox{width:100%;max-width:330px;background:var(--surface);color:var(--text);border-radius:var(--r-lg);padding:22px 20px 18px;text-align:center;transform:translateY(10px) scale(.98);transition:transform .2s cubic-bezier(.22,.9,.3,1);box-shadow:var(--shadow-2)}
.modal.on .mbox{transform:none}
.mtitle{font-size:15px;margin-bottom:8px}
.mtext{font-size:13px;color:var(--text-2);line-height:1.65;margin-bottom:16px;white-space:pre-wrap}
.mbox input{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;margin-bottom:16px;outline:none;background:var(--surface-2);color:var(--text);transition:border-color .18s,box-shadow .18s}.mfield{display:none;gap:8px;margin-bottom:16px}
.mfield.on{display:block}
.mlink{display:none;margin:-6px 0 14px;border:0;background:none;color:var(--brand-dark);font-size:13px;font-family:inherit;cursor:pointer;padding:4px 8px;border-radius:7px;transition:background .15s,opacity .15s}
.mlink.on{display:inline-block}
.mlink:hover{background:var(--brand-soft)}
.mlink:active{opacity:.6}
.mfield input{margin-bottom:0;flex:1;min-width:0}

.mbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.mbtns{display:flex;gap:10px}
.mbtns button{flex:1;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--text);transition:background .15s,border-color .15s}
.mbtns button:hover{background:var(--hover)}
.mbtns button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.mbtns button.primary:hover{background:var(--brand-dark)}
.mbtns button.danger{background:#fa5151;border-color:#fa5151;color:#fff}
.mbtns button.danger:hover{background:#e84646}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--toast-bg);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:80%;text-align:center;backdrop-filter:blur(8px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">传输助手</div>
    <div class="tools">
      <button id="btnTheme" class="tbtn icon" type="button" title="切换主题"></button>
      <button id="btnSelect" class="tbtn icon" type="button" title="多选"></button>
      <button id="btnSettings" class="tbtn icon" type="button" title="设置"></button>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <main class="stream" id="stream"></main>
  <div class="selbar" id="selbar">
    <span id="selInfo">已选 0 项</span>
    <div style="display:flex;gap:8px">
      <button id="btnSelCancel" class="sbtn" type="button">取消</button>
      <button id="btnSelDel" class="sbtn danger" type="button"></button>
    </div>
  </div>
  <footer class="composer">
    <div class="field">
      <textarea id="input" rows="1" placeholder="发送消息…"></textarea>
      <div class="field-foot">
        <button id="btnAttach" class="icon-btn" type="button" title="发送文件"></button>
        <button id="btnSend" class="send" type="button" title="发送"></button>
      </div>
    </div>
    <input id="fileInput" type="file" multiple hidden>
  </footer>
</div>

<div class="drawer" id="drawer">
  <div class="panel">
    <div class="phead"><span>设置</span><button id="btnCloseSettings" class="tbtn icon" type="button" title="关闭"></button></div>
    <div class="sec">
      <h3>存储</h3>
      <label class="lbl">存储目录</label>
      <input id="setDir" spellcheck="false">
      <div class="hint">修改后会迁移已有文件，迁移期间暂停发送。</div>
      <div class="stat-row"><span>磁盘</span><b id="stDisk">-</b></div>
      <div class="stat-row"><span>本工具</span><b id="stUsage">-</b></div>
      <div id="kindBars" style="margin-top:8px"></div>
      <button id="btnRescan" class="btn ghost">重新扫描</button>
    </div>
    <div class="sec">
      <h3>外观</h3>
      <div class="seg" id="themeSeg">
        <button type="button" data-theme="light">浅色</button>
        <button type="button" data-theme="dark">深色</button>
      </div>
    </div>
    <div class="sec">
      <h3>上传</h3>
      <div class="grid2">
        <div><label class="lbl">分片大小 MB</label><input id="setChunk" type="number" min="1" max="64"></div>
        <div><label class="lbl">临时保留 小时</label><input id="setTtl" type="number" min="1" max="720"></div>
        <div><label class="lbl">临时配额 GB</label><input id="setQuota" type="number" min="1" max="400"></div>
        <div><label class="lbl">总量上限 GB</label><input id="setTotal" type="number" min="1" max="1000"></div>
      </div>
    </div>
    <div class="sec">
      <h3>访问白名单</h3>
      <div class="hint">当前 IP <code id="stIp">-</code>。留空表示全部放行，填写后仅列表内地址可访问，每行一个 IP 或网段。</div>
      <textarea id="setIps" rows="5" spellcheck="false" placeholder="192.168.5.0/24"></textarea>
      <button id="btnSave" class="btn">保存</button>
    </div>
    <div class="sec">
      <h3>危险操作</h3>
      <button id="btnSettingsClear" class="btn danger">清空全部消息</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lbImg" alt=""></div>
<div class="modal" id="modal">
  <div class="mbox">
    <div class="mtitle" id="mTitle"></div>
    <div class="mtext" id="mText"></div>
    <button id="mFill" type="button" class="mlink"></button>
    <div class="mfield" id="mField">
      <input id="mInput" spellcheck="false">
    </div>
    <div class="mbtns">
      <button id="mCancel">取消</button>
      <button id="mOk" class="primary">确定</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
var $ = function(id){ return document.getElementById(id); };
var S = { items: [], keys: {}, cursor: null, hasMore: true, loading: false, selectMode: false, selected: {}, device: "", locked: false, settings: null };
var stream = $("stream");
var input = $("input");
var queue = [];
var running = 0;
var THEME_KEY = "fh_theme";
function currentTheme(){ return document.documentElement.getAttribute("data-theme") || "light"; }
function applyTheme(t){
  if (t !== "light" && t !== "dark") return;
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  var b = $("btnTheme");
  if (b) b.innerHTML = svg(t === "dark" ? "sun" : "moon");
  var seg = $("themeSeg");
  if (seg) {
    Array.prototype.forEach.call(seg.children, function (el) {
      el.className = el.getAttribute("data-theme") === t ? "on" : "";
    });
  }
}
function toggleTheme(){ applyTheme(currentTheme() === "dark" ? "light" : "dark"); }

var ICONS = {
  send: '<path d="M12 19.5V5M5.5 11.5 12 5l6.5 6.5"/>',
  copy: '<rect x="9" y="9.5" width="10.5" height="10.5" rx="2.4"/><path d="M14.6 5.6H6.4A1.9 1.9 0 0 0 4.5 7.5v8.2"/>',
  close: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  plus: '<path d="M12 5.5v13M5.5 12h13"/>',
  moon: '<path d="M20.4 14.4A8.6 8.6 0 0 1 9.6 3.6a8.6 8.6 0 1 0 10.8 10.8Z"/>',
  sun: '<circle cx="12" cy="12" r="3.8"/><path d="M12 2.6v2M12 19.4v2M4.3 4.3l1.4 1.4M18.3 18.3l1.4 1.4M2.6 12h2M19.4 12h2M4.3 19.7l1.4-1.4M18.3 5.7l1.4-1.4"/>',
  select: '<rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/><path d="M8.1 12.3l2.6 2.6 5.2-5.4"/>',
  check: '<path d="M5 12.6l4.4 4.4L19 7.4"/>',
  gear: '<path d="M4 7h8.2M17.6 7H20M4 12h3.2M11.4 12H20M4 17h8.2M17.6 17H20"/><circle cx="14.7" cy="7" r="2.1"/><circle cx="8.6" cy="12" r="2.1"/><circle cx="14.7" cy="17" r="2.1"/>',
  download: '<path d="M12 4.6v10.6M7.4 10.6 12 15.2l4.6-4.6M4.8 19.4h14.4"/>',
  trash: '<path d="M4.6 7h14.8M9.6 7V5.6A1.6 1.6 0 0 1 11.2 4h1.6a1.6 1.6 0 0 1 1.6 1.6V7M6.6 7l.8 12.1A1.5 1.5 0 0 0 8.9 20.5h6.2a1.5 1.5 0 0 0 1.5-1.4L17.4 7"/>'
};
function svg(name, size){
  size = size || 18;
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}

var nodeMap = {};
var MAX_NODES = 600;

function fmtSize(n){ n = Number(n) || 0; if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB"; return (n / 1073741824).toFixed(2) + " GB"; }
function fmtTime(ts){
  var d = new Date(Number(ts) || 0);
  var now = new Date();
  var hm = (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) return hm;
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
}
function extOf(name){ var i = String(name).lastIndexOf("."); return i < 0 ? "" : String(name).slice(i + 1).toLowerCase(); }
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.className = "toast on";
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = "toast"; }, 2200);
}
function legacyCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  ta.style.top = "0";
  document.body.appendChild(ta);
  var ok = false;
  try {
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    ok = document.execCommand("copy");
  } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function downloadItem(it){
  var a = document.createElement("a");
  a.href = "/f/" + it.kind + "/" + encodeURIComponent(it.name) + "?dl=1";
  a.download = it.title || it.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function copyText(txt){
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(txt).then(function(){ return true; }).catch(function(){ return legacyCopy(txt); });
  }
  return Promise.resolve(legacyCopy(txt));
}

function api(method, url, body){
  var init = { method: method, headers: {} };
  if (body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
  return fetch(url, init).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: r.ok, status: r.status, data: j }; });
  }).catch(function(){ return { ok: false, status: 0, data: { error: "network" } }; });
}
function detectDevice(){
  var d = null;
  try { d = localStorage.getItem("fh_device"); } catch (e) {}
  if (!d) {
    var ua = navigator.userAgent;
    if (ua.indexOf("iPhone") >= 0) d = "iPhone";
    else if (ua.indexOf("iPad") >= 0) d = "iPad";
    else if (ua.indexOf("Android") >= 0) d = "Android";
    else if (ua.indexOf("Macintosh") >= 0) d = "Mac";
    else if (ua.indexOf("Windows") >= 0) d = "Windows";
    else d = "Web";
    try { localStorage.setItem("fh_device", d); } catch (e) {}
  }
  return d;
}
function renderItem(it, animate){
  var wrap = document.createElement("div");
  wrap.className = "msg" + (it.device === S.device ? " own" : "") + (animate ? " anim" : "");
  wrap.setAttribute("data-key", it.key);
  var col = document.createElement("div");
  col.className = "col";
  var meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = it.device || "dev";
  var b = document.createElement("div");
  b.className = "bubble";
  if (it.kind === "image" && it.size <= 8388608) {
    b.className = "bubble img";
    var img = document.createElement("img");
    img.src = "/f/image/" + encodeURIComponent(it.name);
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = it.title;
    img.onerror = function(){ b.className = "bubble"; b.innerHTML = ""; b.appendChild(fileCard(it)); };
    img.addEventListener("click", function(ev){
      if (S.selectMode) return;
      ev.stopPropagation();
      openLightbox(it);
    });
    b.appendChild(img);
  } else if (it.kind === "text") {
    b.textContent = it.content != null ? it.content : it.title;
  } else {
    b.appendChild(fileCard(it));
  }
  var body = document.createElement("div");
  body.className = "body";
  body.appendChild(b);
  var ops = document.createElement("div");
  ops.className = "ops";
  var op = document.createElement("button");
  op.className = "act";
  op.type = "button";
  if (it.kind === "text") {
    op.title = "复制";
    op.innerHTML = svg("copy", 15);
    op.addEventListener("click", function(ev){
      ev.stopPropagation();
      var txt = it.content != null ? it.content : (it.title || "");
      copyText(txt).then(function(ok){ toast(ok ? "已复制" : "复制失败"); });
    });
  } else {
    op.title = "下载";
    op.innerHTML = svg("download", 15);
    op.addEventListener("click", function(ev){
      ev.stopPropagation();
      downloadItem(it);
    });
  }
  var foot = document.createElement("div");
  foot.className = "foot";
  ops.appendChild(op);
  var time = document.createElement("div");
  time.className = "time";
  time.textContent = fmtTime(it.ts);
  foot.appendChild(ops);
  foot.appendChild(time);
  body.appendChild(foot);
  col.appendChild(meta);
  col.appendChild(body);
  wrap.appendChild(col);
  if (S.selectMode) {
    wrap.classList.add("pick");
    if (S.selected[it.key]) wrap.classList.add("picked");
    wrap.addEventListener("click", pickHandler);
  }
  return wrap;
}
function fileCard(it){
  var card = document.createElement("div");
  card.className = "card";
  var tag = document.createElement("span");
  tag.className = "tag";
  var e = extOf(it.title);
  tag.textContent = e ? e.slice(0, 4) : "FILE";
  var body = document.createElement("div");
  body.className = "cbody";
  var nm = document.createElement("div");
  nm.className = "cname";
  nm.textContent = it.title;
  var sz = document.createElement("div");
  sz.className = "csize";
  sz.textContent = fmtSize(it.size) + "  下载";
  body.appendChild(nm);
  body.appendChild(sz);
  card.appendChild(tag);
  card.appendChild(body);
  card.addEventListener("click", function(ev){
    if (S.selectMode) return;
    ev.stopPropagation();
    downloadItem(it);
  });
  return card;
}
function trimNodes(){
  while (stream.children.length > MAX_NODES) {
    var first = stream.firstChild;
    if (!first) break;
    var k = first.getAttribute("data-key");
    if (k) { delete nodeMap[k]; delete S.keys[k]; }
    stream.removeChild(first);
  }
}
function addItem(it, toBottom){
  if (!it || S.keys[it.key]) return;
  S.keys[it.key] = true;
  S.items.push(it);
  if (S.items.length > MAX_NODES * 2) S.items = S.items.slice(-MAX_NODES);
  var node = renderItem(it, true);
  nodeMap[it.key] = node;
  stream.appendChild(node);
  if (toBottom) scrollToBottom();
  trimNodes();
}
function scrollToBottom(){ stream.scrollTop = stream.scrollHeight; }
function nearBottom(){ return stream.scrollHeight - stream.scrollTop - stream.clientHeight < 140; }
function loadPage(){
  if (S.loading || !S.hasMore) return;
  S.loading = true;
  var url = "/api/items?limit=30";
  if (S.cursor) url += "&cursor=" + encodeURIComponent(S.cursor);
  api("GET", url).then(function(r){
    S.loading = false;
    if (!r.ok) { toast("加载失败"); return; }
    var d = r.data || {};
    S.hasMore = !!d.hasMore;
    S.cursor = d.nextCursor || null;
    var list = (d.items || []).slice().reverse();
    if (S.items.length === 0) {
      list.forEach(function(it){ if (S.keys[it.key]) return; S.keys[it.key] = true; S.items.push(it); var nd = renderItem(it); nodeMap[it.key] = nd; stream.appendChild(nd); });
      scrollToBottom();
    } else {
      var before = stream.scrollHeight;
      var frag = document.createDocumentFragment();
      list.forEach(function(it){ if (S.keys[it.key]) return; S.keys[it.key] = true; S.items.unshift(it); var nd = renderItem(it); nodeMap[it.key] = nd; frag.insertBefore(nd, frag.firstChild); });
      stream.insertBefore(frag, stream.firstChild);
      stream.scrollTop += stream.scrollHeight - before;
    }
  });
}
var scrollPending = false;
stream.addEventListener("scroll", function(){
  if (scrollPending) return;
  scrollPending = true;
  requestAnimationFrame(function(){
    scrollPending = false;
    if (stream.scrollTop < 80 && S.hasMore && !S.loading) loadPage();
  });
}, { passive: true });
function connect(){
  var es = new EventSource("/api/events");
  es.onmessage = function(ev){
    var msg = null;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (!msg) return;
    if (msg.type === "add") { addItem(msg.item, nearBottom()); }
    else if (msg.type === "del") {
      (msg.keys || []).forEach(function(k){
        var el = nodeMap[k];
        if (el && el.parentNode) el.parentNode.removeChild(el);
        delete nodeMap[k];
        delete S.keys[k];
      });
    } else if (msg.type === "clear") {
      stream.innerHTML = "";
      S.keys = {}; S.items = []; S.cursor = null; S.hasMore = true; nodeMap = {};
      loadPage();
    } else if (msg.type === "migrate") {
      updateMigrate(msg.migrate);
    }
  };
}
function updateMigrate(m){
  var b = $("banner");
  if (!m) { b.className = "banner"; b.textContent = ""; return; }
  if (m.state === "migrating") {
    b.className = "banner on";
    b.textContent = "正在迁移存储 " + (m.done || 0) + "/" + (m.total || 0) + " · " + fmtSize(m.bytes || 0) + " / " + fmtSize(m.totalBytes || 0);
    setLocked(true);
  } else if (m.state === "failed") {
    b.className = "banner on";
    b.textContent = "迁移失败：" + (m.error || "未知错误");
    setLocked(false);
  } else if (m.state === "interrupted") {
    b.className = "banner on";
    b.textContent = "上次迁移未完成，请在设置页清理残留";
    setLocked(false);
  } else {
    b.className = "banner";
    b.textContent = "";
    setLocked(false);
  }
}
function setLocked(v){
  S.locked = !!v;
  $("btnSend").disabled = !!v;
  $("btnAttach").disabled = !!v;
  input.disabled = !!v;
}
function sendText(){
  var v = input.value;
  if (!v.trim()) return;
  if (S.locked) { toast("正在迁移存储，暂不可发送"); return; }
  input.value = "";
  autoGrow();
  api("POST", "/api/text", { content: v, device: S.device }).then(function(r){
    if (!r.ok) { toast("发送失败"); return; }
    if (r.data && r.data.item) addItem(Object.assign({ content: v }, r.data.item), true);
  });
}
function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
}
function kindOf(file){
  var t = String(file.type || "");
  if (t.indexOf("image/") === 0) return "image";
  if (t.indexOf("video/") === 0) return "video";
  if (t.indexOf("audio/") === 0) return "audio";
  var e = extOf(file.name);
  if (["jpg","jpeg","png","gif","webp","bmp","heic","heif","avif"].indexOf(e) >= 0) return "image";
  if (["mp4","mov","mkv","webm","m4v"].indexOf(e) >= 0) return "video";
  if (["mp3","m4a","wav","flac","ogg","aac"].indexOf(e) >= 0) return "audio";
  return "file";
}
function fingerprint(file){
  var s = file.name + ":" + file.size + ":" + (file.lastModified || 0) + ":" + S.device;
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}
function tempNode(name, size, onCancel){
  var wrap = document.createElement("div");
  wrap.className = "msg own";
  var col = document.createElement("div");
  col.className = "col";
  var meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (S.device || "dev") + "  上传中";
  var b = document.createElement("div");
  b.className = "bubble";
  var nm = document.createElement("div");
  nm.className = "cname";
  nm.style.maxWidth = "220px";
  nm.textContent = name;
  var bar = document.createElement("div");
  bar.className = "prog";
  var fill = document.createElement("i");
  bar.appendChild(fill);
  var row = document.createElement("div");
  row.className = "prow";
  var info = document.createElement("div");
  info.className = "pinfo";
  info.textContent = "0% · " + fmtSize(size);
  var btn = document.createElement("button");
  btn.className = "pcancel";
  btn.type = "button";
  btn.title = "取消上传";
  btn.innerHTML = svg("close", 13);
  btn.addEventListener("click", function(ev){ ev.stopPropagation(); if (onCancel) onCancel(); });
  row.appendChild(info);
  row.appendChild(btn);
  b.appendChild(nm);
  b.appendChild(bar);
  b.appendChild(row);
  col.appendChild(meta);
  col.appendChild(b);
  wrap.appendChild(col);
  stream.appendChild(wrap);
  scrollToBottom();
  return { node: wrap, fill: fill, info: info, size: size };
}

function xhrPut(url, blob, onProgress, tries, reg){
  tries = tries == null ? 2 : tries;
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    if (reg) reg.push(xhr);
    xhr.open("PUT", url);
    xhr.upload.onprogress = function(e){ if (e.lengthComputable) onProgress(e.loaded); };
    xhr.onabort = function(){ reject(new Error("aborted")); };
    xhr.onload = function(){
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else if (tries > 0) setTimeout(function(){ xhrPut(url, blob, onProgress, tries - 1, reg).then(resolve, reject); }, 800);
      else reject(new Error("HTTP " + xhr.status));
    };
    xhr.onerror = function(){
      if (tries > 0) setTimeout(function(){ xhrPut(url, blob, onProgress, tries - 1, reg).then(resolve, reject); }, 800);
      else reject(new Error("网络错误"));
    };
    xhr.send(blob);
  });
}

function uploadOne(file){
  var kind = kindOf(file);
  var fp = fingerprint(file);
  return api("POST", "/api/upload/init", { name: file.name, kind: kind, size: file.size, device: S.device, fingerprint: fp }).then(function(r){
    if (!r.ok) {
      if (r.data && r.data.error === "quota_exceeded") throw new Error("超出总量上限 " + Math.round(r.data.quota / 1073741824) + " GB，请先清理旧文件");
      throw new Error(r.data && r.data.error === "no_space" ? "磁盘空间不足" : "初始化失败");
    }
    var id = r.data.uploadId;
    var total = file.size;
    var next = Number(r.data.offset) || 0;
    var doneBytes = next;
    var active = {};
    var aborted = false;
    var xhrs = [];
    var chunkSize = ((S.settings && S.settings.chunkSizeMB) || 16) * 1024 * 1024;
    var tmp = tempNode(file.name, total, cancel);
    function cancel(){
      if (aborted) return;
      aborted = true;
      for (var i = 0; i < xhrs.length; i++) {
        try { xhrs[i].abort(); } catch (e) {}
      }
      tmp.fill.style.width = "0%";
      tmp.info.textContent = "已取消";
      api("POST", "/api/upload/cancel", { uploadId: id }).then(function(){
        if (tmp.node.parentNode) tmp.node.parentNode.removeChild(tmp.node);
        toast("已取消，临时文件已清理");
      });
    }
    var paintPending = false;
    function paint(){
      if (paintPending) return;
      paintPending = true;
      requestAnimationFrame(function(){
        paintPending = false;
        var inflight = 0;
        for (var k in active) inflight += active[k];
        var done = Math.min(total, doneBytes + inflight);
        var pct = total ? Math.round(done * 100 / total) : 100;
        tmp.fill.style.width = pct + "%";
        tmp.info.textContent = pct + "% · " + fmtSize(done) + " / " + fmtSize(total);
      });
    }
    paint();
    function worker(){
      if (aborted || next >= total) return Promise.resolve();
      var offset = next;
      var end = Math.min(offset + chunkSize, total);
      next = end;
      active[offset] = 0;
      return xhrPut("/api/upload/chunk?uploadId=" + encodeURIComponent(id) + "&offset=" + offset, file.slice(offset, end), function(loaded){
        if (aborted) return;
        active[offset] = loaded;
        paint();
      }, 2, xhrs).then(function(){
        if (aborted) return Promise.resolve();
        delete active[offset];
        doneBytes += (end - offset);
        paint();
        return worker();
      });
    }
    var jobs = [];
    for (var i = 0; i < 3; i++) jobs.push(worker());
    return Promise.all(jobs).then(function(){
      if (aborted) return null;
      return api("POST", "/api/upload/finish", { uploadId: id });
    }).then(function(fr){
      if (aborted || !fr) return;
      if (tmp.node.parentNode) tmp.node.parentNode.removeChild(tmp.node);
      if (fr.ok && fr.data.item) addItem(fr.data.item, true);
      else toast("上传失败");
    }).catch(function(e){
      if (aborted) return;
      if (tmp.node.parentNode) tmp.node.parentNode.removeChild(tmp.node);
      toast("上传失败：" + (e && e.message ? e.message : ""));
    });
  });
}

function pump(){
  while (running < 2 && queue.length){
    var f = queue.shift();
    running += 1;
    uploadOne(f).catch(function(){}).then(function(){ running -= 1; pump(); });
  }
}
function enqueue(files){
  if (S.locked) { toast("正在迁移存储，暂不可发送"); return; }
  for (var i = 0; i < files.length; i++) queue.push(files[i]);
  pump();
}
function pickHandler(ev){
  var node = ev.currentTarget;
  var key = node.getAttribute("data-key");
  if (!key) return;
  if (S.selected[key]) { delete S.selected[key]; node.classList.remove("picked"); }
  else { S.selected[key] = true; node.classList.add("picked"); }
  $("selInfo").textContent = "已选 " + Object.keys(S.selected).length + " 项";
}
function enterSelect(){
  S.selectMode = true;
  S.selected = {};
  $("selbar").className = "selbar on";
  $("btnSelect").innerHTML = svg("check");
  $("selInfo").textContent = "已选 0 项";
  Array.prototype.forEach.call(stream.children, function(node){
    node.classList.add("pick");
    node.addEventListener("click", pickHandler);
  });
}
function exitSelect(){
  S.selectMode = false;
  S.selected = {};
  $("selbar").className = "selbar";
  $("btnSelect").innerHTML = svg("select");
  Array.prototype.forEach.call(stream.children, function(node){
    node.classList.remove("pick");
    node.classList.remove("picked");
    node.removeEventListener("click", pickHandler);
  });
}
function modal(opts){
  return new Promise(function(resolve){
    var m = $("modal");
    $("mTitle").textContent = opts.title || "";
    $("mText").textContent = opts.text || "";
    var inp = $("mInput");
    var mf = $("mField");
    var fillBtn = $("mFill");
    if (opts.needInput) {
      mf.className = "mfield on";
      inp.value = "";
      inp.placeholder = opts.placeholder || "";
      fillBtn.className = "mlink on";
      fillBtn.textContent = "填入「" + opts.needInput + "」";
      fillBtn.onclick = function(){ inp.value = opts.needInput; inp.focus(); };
    } else {
      mf.className = "mfield";
      fillBtn.className = "mlink";
      fillBtn.onclick = null;
    }
    var ok = $("mOk");
    ok.className = opts.danger ? "danger" : "primary";
    ok.textContent = opts.okText || "确定";
    $("mCancel").textContent = opts.cancelText || "取消";
    m.classList.add("on");
    function done(v){ m.classList.remove("on"); ok.onclick = null; $("mCancel").onclick = null; resolve(v); }
    ok.onclick = function(){
      if (opts.needInput && inp.value.trim() !== opts.needInput) { toast("请输入 " + opts.needInput); return; }
      done(true);
    };
    $("mCancel").onclick = function(){ done(false); };
  });
}
function doDelete(keys, cb){
  if (!keys.length) return;
  modal({ title: "删除", text: "删除 " + keys.length + " 条消息及其文件，不可恢复。", danger: true, okText: "删除" }).then(function(ok){
    if (cb) cb(ok);
    if (!ok) return;
    api("POST", "/api/delete", { keys: keys }).then(function(r){
      if (!r.ok) { toast("删除失败"); return; }
      var fail = 0;
      (r.data.results || []).forEach(function(x){
        if (!x.ok) { fail += 1; return; }
        var el = nodeMap[x.key];
        if (el && el.parentNode) el.parentNode.removeChild(el);
        delete nodeMap[x.key];
        delete S.keys[x.key];
      });
      toast(fail ? "部分删除失败" : "已删除");
    });
  });
}
function doClear(){
  modal({ title: "清空全部", text: "将删除所有消息和文件，不可恢复。\n输入「清空」确认，或点右侧按钮直接填入。", needInput: "清空", danger: true, okText: "清空" }).then(function(ok){
    if (!ok) return;
    api("POST", "/api/clear", {}).then(function(r){
      if (!r.ok) { toast("清空失败"); return; }
      stream.innerHTML = "";
      S.keys = {}; S.items = []; S.cursor = null; S.hasMore = true; nodeMap = {};
      toast("已清空");
      loadPage();
    });
  });
}
function openLightbox(it){
  var lb = $("lightbox");
  $("lbImg").src = "/f/image/" + encodeURIComponent(it.name);
  lb.classList.add("on");
  lb.onclick = function(){ lb.classList.remove("on"); lb.onclick = null; };
  document.onkeydown = function(e){ if (e.key === "Escape" && lb.classList.contains("on")) { lb.classList.remove("on"); document.onkeydown = null; } };
}
function loadSettings(){
  api("GET", "/api/settings").then(function(r){
    if (!r.ok) return;
    var d = r.data;
    S.settings = d;
    setLocked(!!d.locked || (d.migrate && d.migrate.state === "migrating"));
    if (document.activeElement !== $("setDir")) $("setDir").value = d.dataDir || "";
    if (document.activeElement !== $("setIps")) $("setIps").value = (d.allowIps || []).join("\n");
    if (document.activeElement !== $("setChunk")) $("setChunk").value = d.chunkSizeMB || 8;
    if (document.activeElement !== $("setTtl")) $("setTtl").value = d.partTtlHours || 24;
    if (document.activeElement !== $("setQuota")) $("setQuota").value = d.partQuotaGB || 50;
    if (document.activeElement !== $("setTotal")) $("setTotal").value = d.totalQuotaGB || 200;
    $("stIp").textContent = d.selfIp || "-";
    $("stDisk").textContent = fmtSize(d.disk.used) + " / " + fmtSize(d.disk.total) + "（可用 " + fmtSize(d.disk.free) + "）";
    $("stUsage").textContent = fmtSize(d.usage.bytes) + " / " + fmtSize((d.totalQuotaGB || 200) * 1073741824) + " · " + d.usage.files + " 个";
    var bars = $("kindBars");
    bars.innerHTML = "";
    var maxB = 1;
    (d.kinds || []).forEach(function(k){ var v = (d.usage.byKind[k.kind] || {}).bytes || 0; if (v > maxB) maxB = v; });
    (d.kinds || []).forEach(function(k){
      var info = d.usage.byKind[k.kind] || { bytes: 0, files: 0 };
      var row = document.createElement("div");
      row.className = "krow";
      var nm = document.createElement("span"); nm.textContent = k.label;
      var bar = document.createElement("div"); bar.className = "kbar";
      var fill = document.createElement("i");
      fill.style.width = Math.round(info.bytes * 100 / maxB) + "%";
      bar.appendChild(fill);
      var em = document.createElement("em"); em.textContent = fmtSize(info.bytes);
      row.appendChild(nm); row.appendChild(bar); row.appendChild(em);
      bars.appendChild(row);
    });
    updateMigrate(d.migrate);
  });
}
function saveSettings(force){
  var body = {
    dataDir: $("setDir").value.trim(),
    allowIps: $("setIps").value,
    chunkSizeMB: Number($("setChunk").value),
    partTtlHours: Number($("setTtl").value),
    partQuotaGB: Number($("setQuota").value),
    totalQuotaGB: Number($("setTotal").value)
  };
  if (force) body.force = true;
  api("PUT", "/api/settings", body).then(function(r){
    if (r.status === 409 && r.data && r.data.needConfirm) {
      modal({ title: "注意", text: "保存后当前 IP " + r.data.selfIp + " 将不在白名单内，可能无法再访问。确定继续？", danger: true, okText: "继续" }).then(function(ok){ if (ok) saveSettings(true); });
      return;
    }
    if (!r.ok) {
      if (r.data && r.data.error === "bad_rule") toast("第 " + r.data.line + " 行格式错误：" + r.data.value);
      else if (r.data && r.data.error === "locked") toast("正在迁移中");
      else toast("保存失败");
      return;
    }
    toast(r.data.migrating ? "已保存，正在迁移存储" : "已保存");
    loadSettings();
    if (r.data.migrating) closeDrawer();
  });
}
function openDrawer(){ $("drawer").classList.add("on"); loadSettings(); }
function closeDrawer(){ $("drawer").classList.remove("on"); }

$("btnTheme").addEventListener("click", toggleTheme);
$("themeSeg").addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("button") : null;
  if (el && el.getAttribute("data-theme")) applyTheme(el.getAttribute("data-theme"));
});
$("btnSend").addEventListener("click", sendText);
$("btnAttach").addEventListener("click", function(){ $("fileInput").click(); });
$("fileInput").addEventListener("change", function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  e.target.value = "";
  if (files.length) enqueue(files);
});
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey) {
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (!coarse) { e.preventDefault(); sendText(); }
  }
});
$("btnSelect").addEventListener("click", function(){ if (S.selectMode) exitSelect(); else enterSelect(); });
$("btnSelCancel").addEventListener("click", exitSelect);
$("btnSelDel").addEventListener("click", function(){ var keys = Object.keys(S.selected); if (!keys.length) { toast("没有选中"); return; } doDelete(keys, function(ok){ if (ok) exitSelect(); }); });
$("btnSettingsClear").addEventListener("click", function(){ closeDrawer(); doClear(); });
$("btnSettings").addEventListener("click", openDrawer);
$("btnCloseSettings").addEventListener("click", closeDrawer);
$("drawer").addEventListener("click", function(e){ if (e.target === $("drawer")) closeDrawer(); });
$("btnSave").addEventListener("click", function(){ saveSettings(false); });
$("btnRescan").addEventListener("click", function(){ fetch("/api/rescan", { method: "POST" }).then(function(r){ return r.json(); }).then(function(d){ stream.innerHTML = ""; S.keys = {}; S.items = []; S.cursor = null; S.hasMore = true; loadPage(); loadSettings(); toast("已重新扫描 " + (d.count || 0) + " 个文件"); }); });

document.addEventListener("dragenter", function(e){ e.preventDefault(); });
document.addEventListener("dragover", function(e){ e.preventDefault(); });
document.addEventListener("drop", function(e){
  e.preventDefault();
  var files = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
  if (files.length) enqueue(files);
});
document.addEventListener("paste", function(e){
  var items = (e.clipboardData && e.clipboardData.items) || [];
  var files = [];
  for (var i = 0; i < items.length; i++){
    if (items[i].kind === "file") { var f = items[i].getAsFile(); if (f) files.push(f); }
  }
  if (files.length) { e.preventDefault(); enqueue(files); }
});

S.device = detectDevice();
$("btnSend").innerHTML = svg("send");
$("btnAttach").innerHTML = svg("plus");
$("btnSettings").innerHTML = svg("gear");
$("btnSelect").innerHTML = svg("select");
$("btnCloseSettings").innerHTML = svg("close", 16);
$("btnSelDel").innerHTML = svg("trash", 14) + "<span>删除</span>";
applyTheme(currentTheme());
loadPage();
connect();
loadSettings();
})();
</script>
</body>
</html>
